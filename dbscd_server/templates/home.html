<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBSCD - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, sans-serif;
        }
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-hover: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #3b82f6;
            --border: #333333;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 顶部全局导航栏 */
        .top-nav {
            display: flex;
            gap: 14px;
            padding: 18px 26px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 17px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }
        .nav-btn.active {
            background-color: var(--accent);
            color: white;
        }

        /* 主内容容器 */
        .main-container {
            padding: 22px 26px;
        }

        /* ========== 用户页面头部信息栏（只有切换到用户tab才显示） ========== */
        .user-header-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .user-action-group {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .user-info-left {
            display: flex;
            flex-direction: column;
            gap:4px;
        }
        .user-nick {
            font-size:22px;
            color:#fff;
        }
        .user-id-text {
            color:#aaa;
        }
        .user-action-btn {
            padding:6px 12px;
            border: none;
            background:#333;
            color:#fff;
            border-radius:4px;
            cursor:pointer;
        }
        .user-action-btn.active {
            background:#2563eb;
        }
        .btn-setting {
            padding:6px 12px;
            border: none;
            background:#333;
            color:#fff;
            border-radius:4px;
            cursor:pointer;
        }
        .page-placeholder {
            color:#cccccc;
            text-align:center;
            padding:30px 0;
        }
        
        
        

        /* 动态内容渲染区：设置/关注列表/粉丝/点赞/评论/作品 全部渲染在这里 */
        .user-content-area {
            min-height: 420px;
        }
        .list-title-bar {
            font-size: 20px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        /* 横向用户卡片（关注、粉丝） */
        .user-item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .user-item-info .card-nick {
            font-size: 19px;
            color: var(--text-primary);
        }
        .user-item-info .card-uid {
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        /* 评论卡片 */
        .comment-item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .comment-item-info .comment-time {
            font-size: 15px;
            color: var(--text-secondary);
        }
        .comment-item-info .comment-content {
            font-size: 19px;
            color: var(--text-primary);
            margin-top: 4px;
        }
        .card-btn {
            padding: 8px 14px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: transparent;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }
        .card-btn:hover {
            background-color: var(--accent);
            color: white;
        }
        .empty-tip {
            font-size: 18px;
            color: var(--text-secondary);
            padding: 40px;
            text-align: center;
        }
        .loading-tip {
            font-size: 18px;
            color: var(--text-secondary);
            padding: 40px;
            text-align: center;
        }
        .error-tip {
            font-size: 18px;
            color: #f87171;
            padding: 40px;
            text-align: center;
        }
        /* 其他页面占位容器：推荐、关注、搜索、发布、消息 */
        .page-placeholder {
            font-size: 20px;
            color: var(--text-secondary);
            padding: 40px;
            text-align: center;
        }

        .search-sub-btn{
            background:#333; color:#fff; border:none; padding:6px 12px; margin-right:8px; border-radius:4px; cursor:pointer;
        }
        .search-sub-btn:hover{background:#4080ff;}
        /* 和关注列表完全一样的细长用户卡片样式，直接复用 */
        .search-user-card{
            display:flex; justify-content:space-between; align-items:center;
            padding:12px 14px; background:#222; border-radius:6px; margin-bottom:8px;
        }
        .search-user-info{
            color:#eee;
        }
        .search-user-nick{
            font-size:16px;
        }
        .search-user-id{
            font-size:13px; color:#aaa;
        }
        /* 视频卡片简单样式，你后续可以美化 */
        .search-video-card{
            padding:12px 14px; background:#222; border-radius:6px; margin-bottom:8px; color:#eee;
        }

        .setting-btn {
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #272727;
            color: white;
            text-align: left;
        }
        .warning-btn {
            background: #775000;
        }
        .danger-btn {
            background: #772222;
        }
        /* 黑名单用户卡片，和关注列表卡片完全一致 */
        .black-user-card{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#222;
            padding:10px 14px;
            border-radius:4px;
            margin-bottom:8px;
        }
        .black-user-info{
            color:#fff;
        }
        .black-user-nick{
            font-size:16px;
        }
        .black-user-id{
            font-size:13px;color:#aaa;margin-top:3px;
        }



        /* 视频作品卡片容器 */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
            padding: 10px 0;
        }
        /* 卡片整体：4:3 比例 */
        .video-card {
            background: #1e1e1e;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
        }
        /* 封面区域，严格4:3 */
        .card-cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #111;
        }
        .card-cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-cover-wrap .no-cover {
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#888;
        }
        /* 卡片文字信息区 */
        .card-info {
            padding:10px;
            color:#fff;
        }
        .card-title {
            font-size:15px;
            line-height:1.4;
            overflow:hidden;
            text-overflow:ellipsis;
            display:-webkit-box;
            -webkit-line-clamp:2;
            line-clamp: 2;
            -webkit-box-orient:vertical;
            margin-bottom:6px;
        }
        .card-meta {
            font-size:12px;
            color:#aaa;
            line-height:1.4;
        }
        /* 播放按钮容器，居中浮在封面上面 */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            opacity: 0;
            transition: all 0.2s ease;
            pointer-events: auto;
            z-index: 2;
        }
        /* 鼠标悬浮卡片的时候显示播放按钮 */
        .video-card:hover .play-btn {
            opacity: 1;
        }
        .play-btn::after {
            /* 三角播放图标，纯css，不用图片 */
            content: "";
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid #ffffff;
            margin-left: 3px;
        }
        /* 封面蒙层，hover加深一点，氛围感 */
        .card-cover-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0);
            transition: background 0.2s;
            z-index:1;
        }
        .video-card:hover .card-cover-wrap::before {
            background: rgba(0,0,0,0.18);
        }

        /* 视频详情浮窗 遮罩 */
        .video-detail-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            padding: 40px;
            overflow: auto;
        }
        .modal-close-btn {
            position: absolute;
            top:16px;
            right:24px;
            color:#fff;
            cursor:pointer;
            font-size:18px;
            background: #222;
            padding:6px 12px;
            border-radius:4px;
        }
        .detail-layout-row {
            display:flex;
            gap:24px;
            width:100%;
            height: calc(100vh - 80px);
        }
        .video-play-wrap {
            flex: 3;
            background:#000;
            border-radius:8px;
            position:relative;
        }
        .fullscreen-btn {
            position:absolute;
            bottom:12px;
            right:12px;
            padding:4px 10px;
            background:#333;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }
        .video-info-panel {
            flex: 1;
            background:#1e1e1e;
            border-radius:8px;
            padding:20px;
            color:#eee;
            overflow-y:auto;
        }
        .video-title {
            color:#fff;
            font-size:22px;
            margin-bottom:16px;
        }
        .author-row, .stat-row, .time-row {
            margin:10px 0;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .small-btn {
            padding:4px 10px;
            border:none;
            border-radius:4px;
            cursor:pointer;
            background:#333;
            color:#fff;
        }
        .small-btn:hover {
            background:#444;
        }
        .like-btn.liked {
            background:#e74c3c;
        }

        /* 全屏浮窗 */
        .video-fullscreen-modal {
            position:fixed;
            inset:0;
            background:#000;
            z-index:1000;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .exit-full-btn {
            position:absolute;
            top:16px;
            right:24px;
            background:#222;
            color:#fff;
            border:none;
            padding:6px 12px;
            border-radius:4px;
            cursor:pointer;
        }
        

    </style>
</head>

<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <button class="nav-btn" data-page="recommend" onclick="switchGlobalPage('recommend')">推荐</button>
        <button class="nav-btn" data-page="follow" onclick="switchGlobalPage('follow')">关注</button>
        <button class="nav-btn" data-page="search" onclick="switchGlobalPage('search')">搜索</button>
        <button class="nav-btn" data-page="publish" onclick="switchGlobalPage('publish')">发布</button>
        <button class="nav-btn" data-page="message" onclick="switchGlobalPage('message')">消息</button>
        <button class="nav-btn" data-page="user" onclick="switchGlobalPage('user')">用户</button>
    </div>

    <!-- ===================== 唯一主内容渲染容器：所有页面都渲染在这里 ===================== -->
    <div id="mainContentBox" style="width:100%;box-sizing:border-box;">
        <!-- 所有推荐/关注/搜索/发布/消息/用户页面内容全部渲染到此盒子内部 -->
    </div>

    <!-- ==============================================
        【模板容器区】所有页面模板，永久隐藏，只用来clone克隆！永远不直接append移动！
        ============================================== -->
    <div id="templateArea" style="display: none;">
        <!-- 搜索页模板 -->
        <div id="tpl_searchPage">
            <div id="searchSubMenu" style="padding:8px 20px; background:#222;">
                <button class="search-sub-btn" data-type="user">用户搜索</button>
                <button class="search-sub-btn" data-type="video">视频搜索</button>
            </div>
            <div id="searchInputWrap" style="padding:10px 20px; background:#2b2b2b; gap:8px; display:flex; align-items:center;">
                <input id="searchInput" type="text" placeholder="输入搜索关键词..." style="padding:6px; width:400px; background:#111; color:#fff; border:1px solid #444; border-radius:4px;">
                <button id="doSearchBtn" style="padding:6px 14px; background:#4080ff; color:white; border:none; border-radius:4px;">搜索</button>
            </div>
            <div id="searchResultWrap" style="padding:16px 20px;">
                <div id="searchResultList"></div>
            </div>
        </div>

        <!-- 发布页面模板 -->
        <div id="tpl_publishPage">
            <div id="publishContentArea" style="width:100%;padding:40px;box-sizing:border-box;">
                <div style="display:flex;justify-content:center;">
                    <button id="btnPublishVideo" onclick="openVideoUploadModal()" style="
                        width:20vw;
                        padding:40px 0;
                        font-size:18px;
                        background:#2563eb;
                        color:#fff;
                        border:none;
                        border-radius:6px;
                        cursor:pointer;
                    ">发布视频</button>
                </div>
            </div>
        </div>

        <!-- 消息页面模板 -->
        <div id="tpl_messagePage">
            <div id="messageContentArea" style="width:100%;padding:40px;box-sizing:border-box;">
                <div style="display:flex;justify-content:center;gap:24px;">
                    <button id="btnUnreadMsg" onclick="openUnreadMessagePanel()" style="
                        width:20vw;
                        padding:40px 0;
                        font-size:18px;
                        background:#2563eb;
                        color:#fff;
                        border:none;
                        border-radius:6px;
                        cursor:pointer;
                    ">未读消息</button>
                    <button id="btnHistoryMsg" onclick="openHistoryMessagePanel()" style="
                        width:20vw;
                        padding:40px 0;
                        font-size:18px;
                        background:#2563eb;
                        color:#fff;
                        border:none;
                        border-radius:6px;
                        cursor:pointer;
                    ">历史消息</button>
                </div>
            </div>
        </div>

        <!-- 用户页面模板【重点：移除全部onclick内联事件！】 -->
        <div id="tpl_userPage">
            <!-- 用户页头部信息行（昵称ID + 设置 + 右侧功能按钮组） -->
            <div class="user-header-bar" id="userHeaderBar" style="padding:16px 20px;box-sizing:border-box;">
                <div class="user-info-left">
                    <div class="user-nick" id="nickName">加载中...</div>
                    <div class="user-id-text" id="userIdText">ID: --</div>
                </div>
                <button class="btn-setting" onclick="openSetting()">设置</button>
                <button class="btn-setting" onclick="openFeedbackPage()" style="margin-left:8px;">反馈</button>

                <div class="user-action-group">
                    <button class="user-action-btn" data-sub="followList">关注列表</button>
                    <button class="user-action-btn" data-sub="fanList">粉丝列表</button>
                    <button class="user-action-btn" data-sub="likeVideo">点赞视频</button>
                    <button class="user-action-btn" data-sub="comment">评论</button>
                    <button class="user-action-btn" data-sub="works">作品</button>
                </div>
            </div>
            <!-- 用户子页面内容容器，放在userHeaderBar下方，属于用户页面内部 -->
            <div id="userContentArea" style="padding:0 20px 20px;box-sizing:border-box;"></div>
        </div>
    </div>


    <!-- ==============================================
        【全局悬浮浮窗区】 不进mainContentBox，固定悬浮顶层，不受页面切换影响
        ============================================== -->
    <!-- 视频上传浮层卡片（全局fixed浮窗） -->
    <div id="videoUploadModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center;">
        <div style="background:#181818;width:520px;padding:24px;border-radius:8px;color:#fff;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <span style="font-size:18px;">发布新视频</span>
                <button onclick="closeVideoUploadModal()" style="background:#444;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;">✕ 退出</button>
            </div>

            <div style="margin-bottom:16px;">
                <label>选择 MP4 视频</label>
                <input type="file" id="videoFileInput" accept=".mp4" style="margin-top:8px;color:#ccc;">
            </div>
            <div style="margin-bottom:16px;">
                <label>视频标题 <span style="color:#aaa;font-size:12px;">（最多128字）</span></label>
                <input type="text" id="videoTitleInput" placeholder="输入视频标题" maxlength="128" style="
                    width:100%;
                    box-sizing:border-box;
                    margin-top:8px;
                    padding:8px;
                    background:#222;
                    border:1px solid #444;
                    color:#fff;
                    border-radius:4px;
                ">
            </div>
            <div style="margin-bottom:16px;">
                <div>上传进度：<span id="uploadPercent">0</span>%</div>
                <div style="width:100%;height:10px;background:#333;border-radius:5px;overflow:hidden;margin-top:6px;">
                    <div id="progressBar" style="width:0%;height:100%;background:#2563eb;"></div>
                </div>
            </div>
            <button onclick="submitVideoUpload()" style="
                width:100%;
                padding:10px;
                background:#2563eb;
                color:#fff;
                border:none;
                border-radius:4px;
                cursor:pointer;
                font-size:16px;
            ">上传并发布</button>
        </div>
    </div>

    <!-- 消息列表悬浮弹窗 -->
    <div id="msgListModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:9000;overflow-y:auto;box-sizing:border-box;padding:40px;">
        <div style="max-width:900px;margin:0 auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h3 id="msgListTitle" style="color:#eee;margin:0;font-size:20px;"></h3>
                <button onclick="closeMsgListModal()" style="background:#dc2626;color:#fff;border:none;border-radius:4px;padding:8px 16px;cursor:pointer;">退出</button>
            </div>
            <div id="msgListContainer" style="display:flex;flex-direction:column;gap:12px;">
                <!-- 消息卡片JS动态渲染，卡片样式对齐搜索页用户卡片 -->
            </div>
        </div>
    </div>

    <!-- 消息详情全屏悬浮弹窗 -->
    <div id="msgDetailModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#111;z-index:9999;box-sizing:border-box;padding:40px;overflow-y:auto;">
        <div style="max-width:900px;margin:0 auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
                <h2 id="detailMsgTitle" style="color:#fff;margin:0;"></h2>
                <button onclick="closeMsgDetailModal()" style="background:#dc2626;color:#fff;border:none;border-radius:4px;padding:8px 16px;cursor:pointer;">退出</button>
            </div>
            <div style="color:#aaa;font-size:14px;margin-bottom:24px;" id="detailMsgTime"></div>
            <div style="color:#eee;font-size:17px;line-height:1.8;white-space:pre-wrap;" id="detailMsgContent"></div>
        </div>
    </div>

    <!-- 设置面板浮层（点击设置打开） -->
    <div id="settingModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:998;">
        <div style="padding:32px;">
            <div style="display:flex;flex-direction:column;gap:12px;max-width:20vw;">
                <button class="setting-btn" onclick="openEditInfoModal()" style="padding:10px 14px;font-size:15px;">编辑个人信息</button>
                <button class="setting-btn" onclick="openBlacklistPage()" style="padding:10px 14px;font-size:15px;">黑名单</button>
                <button class="setting-btn warning-btn" onclick="confirmLogout()" style="padding:10px 14px;font-size:15px;">退出登录</button>
                <button class="setting-btn danger-btn" onclick="confirmDeleteAccount()" style="padding:10px 14px;font-size:15px;">注销账号</button>
                <button onclick="closeSettingModal()" style="margin-top:12px;padding:8px;background:#333;color:#fff;border:none;border-radius:4px;cursor:pointer;">关闭</button>
            </div>
        </div>
    </div>

    <!-- 编辑个人信息弹窗（浮于上层，z-index更高） -->
    <div id="editUserInfoModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0.75);z-index:999;">
        <div style="padding:32px;max-width:400px;">
            <button onclick="closeEditInfoModal()" style="margin-bottom:20px;background:#333;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">← 返回</button>
            <div style="color:#fff;margin-bottom:16px;">
                <label>用户昵称</label>
                <input id="inputEditNick" type="text" style="width:100%;margin-top:6px;padding:8px;background:#222;border:1px solid #444;color:#fff;border-radius:4px;">
            </div>
            <div style="color:#fff;margin-bottom:20px;">
                <label>新密码（留空不修改）</label>
                <input id="inputEditPwd" type="password" style="width:100%;margin-top:6px;padding:8px;background:#222;border:1px solid #444;color:#fff;border-radius:4px;">
            </div>

    <script>
        // ===================== 全局配置 =====================
        const api_base = ""; // 后续改成你的后端地址，例如 "http://127.0.0.1:8888"
        const API_BASE = api_base;
        let currentGlobalPage = "recommend";
        let currentUserSubPage = null;
        let loginUserIdStr = localStorage.getItem("userId");
        let loginUserId = loginUserIdStr ? parseInt(loginUserIdStr) : null;
        const token = localStorage.getItem("access_token");
        if(!token){
            location.href = "/user/login";
        }

        function switchGlobalPage(pageName) {
            currentGlobalPage = pageName;
            // 导航激活样式
            document.querySelectorAll(".nav-btn").forEach(btn => {
                btn.classList.remove("active");
                if (btn.dataset.page === pageName) btn.classList.add("active");
            })

            // 【强制清空主盒子，所有切换都先清空】
            const mainBox = document.getElementById("mainContentBox");
            mainBox.innerHTML = "";

            // 重置用户子按钮激活状态
            document.querySelectorAll(".user-action-btn").forEach(b => b.classList.remove("active"));
            // 重置搜索模式
            searchMode = null;

            if (pageName === "recommend") {
                mainBox.innerHTML = `<div style="padding:16px;"><div class="works-grid"></div></div>`;
                const gridWrap = mainBox.querySelector(".works-grid");
                loadRecommendVideo(gridWrap);
            } else if (pageName === "follow") {
                mainBox.innerHTML = `<div style="padding:16px;"><div class="works-grid"></div></div>`;
                const gridWrap = mainBox.querySelector(".works-grid");
                loadFollowVideo(gridWrap);
            } else if (pageName === "search") {
                // 克隆搜索模板，放入main
                const tpl = document.getElementById("tpl_searchPage");
                const clone = tpl.cloneNode(true);
                // 把克隆出来的节点放进主容器
                mainBox.appendChild(clone);
                // 绑定搜索按钮事件（克隆后的元素需要重新绑定）
                bindSearchEvent(clone);
            } else if (pageName === "publish") {
                // 克隆发布模板
                const tpl = document.getElementById("tpl_publishPage");
                const clone = tpl.cloneNode(true);
                mainBox.appendChild(clone);
            } else if (pageName === "message") {
                mainBox.innerHTML = document.getElementById("tpl_messagePage").innerHTML;
            } else if (pageName === "user") {
                // 克隆用户页面模板
                const tpl = document.getElementById("tpl_userPage");
                const clone = tpl.cloneNode(true);
                mainBox.appendChild(clone);

                clone.querySelectorAll(".user-action-btn").forEach(btn => {
                    btn.onclick = () => {
                        const sub = btn.dataset.sub;
                        switchUserSubPage(sub, clone);
                    }
                })

                // 把克隆根节点传给加载函数
                loadUserProfile(clone);
                switchUserSubPage("works", clone);
            }
        }

        /**
         * 推荐视频流
         * GET {api_base}/api/recommend/video-list
         * 渲染卡片样式和作品/点赞视频完全一致，复用getVideoPreviewInfo
         * @param {HTMLElement} container 是works-grid容器
         */
        async function loadRecommendVideo(container) {
            container.innerHTML = `<div style="color:#aaa;grid-column:1/-1;text-align:center;padding:30px;">加载推荐视频...</div>`;
            try {
                const token = localStorage.getItem("access_token") || "";
                const res = await fetch(`${api_base}/api/recommend/video-list?loginUserId=${loginUserId}`, {
                    credentials: "include",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });
                const json = await res.json();
                if (json.code !== 1) {
                    container.innerHTML = `<div style="color:#ff7777;grid-column:1/-1;text-align:center;padding:30px;">加载失败：${json.msg}</div>`;
                    return;
                }
                const videoIdList = json.data;
                if (!Array.isArray(videoIdList) || videoIdList.length === 0) {
                    container.innerHTML = `<div style="color:#aaa;grid-column:1/-1;text-align:center;padding:30px;">暂无推荐视频</div>`;
                    return;
                }
                container.innerHTML = "";
                // 循环videoId拉预览，卡片逻辑和作品完全一样
                for (const vid of videoIdList) {
                    const preview = await getVideoPreviewInfo(vid);
                    if (!preview) continue;
                    const coverHtml = preview.coverUrl
                        ? `<img src="${preview.coverUrl}" alt="cover">`
                        : `<div class="no-cover">无封面</div>`;

                    const cardDom = document.createElement("div");
                    cardDom.className = "video-card";
                    cardDom.innerHTML = `
                            <div class="card-cover-wrap">
                                ${coverHtml}
                                <div class="play-btn" data-vid="${preview.videoId}"></div>
                            </div>
                            <div class="card-info">
                                <div class="card-title">${preview.videoTitle}</div>
                                <div class="card-meta">
                                    作者：${preview.authorNick}(ID:${preview.authorId})<br>
                                    点赞：${preview.likeCount} · ${preview.createTime}
                                </div>
                            </div>
                        `;
                    container.appendChild(cardDom);

                    cardDom.onclick = (e) => {
                        if (e.target.classList.contains("play-btn")) return;
                        openVideo(preview.videoId);
                    };
                    const playBtn = cardDom.querySelector(".play-btn");
                    playBtn.onclick = (e) => {
                        e.stopPropagation();
                        playVideoDirect(preview.videoId);
                    };
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div style="color:red;grid-column:1/-1;text-align:center;padding:30px;">网络异常，推荐流加载失败</div>`;
            }
        }

        /**
         * 关注页视频流
         * GET {api_base}/api/followed/video-list
         * 渲染卡片和推荐完全一致，复用getVideoPreviewInfo
         * @param {HTMLElement} container works-grid容器
         */
        async function loadFollowVideo(container) {
            container.innerHTML = `<div style="color:#aaa;grid-column:1/-1;text-align:center;padding:30px;">加载关注更新视频...</div>`;
            try {
                const token = localStorage.getItem("access_token") || "";
                const res = await fetch(`${api_base}/api/followed/video-list?loginUserId=${loginUserId}`, {
                    credentials: "include",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });
                const json = await res.json();
                if (json.code !== 1) {
                    container.innerHTML = `<div style="color:#ff7777;grid-column:1/-1;text-align:center;padding:30px;">加载失败：${json.msg}</div>`;
                    return;
                }
                const videoIdList = json.data;
                if (!Array.isArray(videoIdList) || videoIdList.length === 0) {
                    container.innerHTML = `<div style="color:#aaa;grid-column:1/-1;text-align:center;padding:30px;">暂无关注作者更新视频</div>`;
                    return;
                }
                container.innerHTML = "";
                // 循环videoId拉预览，卡片逻辑和推荐、作品完全一致
                for (const vid of videoIdList) {
                    const preview = await getVideoPreviewInfo(vid);
                    if (!preview) continue;
                    const coverHtml = preview.coverUrl
                        ? `<img src="${preview.coverUrl}" alt="cover">`
                        : `<div class="no-cover">无封面</div>`;

                    const cardDom = document.createElement("div");
                    cardDom.className = "video-card";
                    cardDom.innerHTML = `
                        <div class="card-cover-wrap">
                            ${coverHtml}
                            <div class="play-btn" data-vid="${preview.videoId}"></div>
                        </div>
                        <div class="card-info">
                            <div class="card-title">${preview.videoTitle}</div>
                            <div class="card-meta">
                                作者：${preview.authorNick}(ID:${preview.authorId})<br>
                                点赞：${preview.likeCount} · ${preview.createTime}
                            </div>
                        </div>
                    `;
                    container.appendChild(cardDom);

                    cardDom.onclick = (e) => {
                        if (e.target.classList.contains("play-btn")) return;
                        openVideo(preview.videoId);
                    };
                    const playBtn = cardDom.querySelector(".play-btn");
                    playBtn.onclick = (e) => {
                        e.stopPropagation();
                        playVideoDirect(preview.videoId);
                    };
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div style="color:red;grid-column:1/-1;text-align:center;padding:30px;">网络异常，关注流加载失败</div>`;
            }
        }


        // 搜索模块事件绑定函数（给克隆出来的搜索DOM绑定事件）
        let searchMode = null;
        function bindSearchEvent(scopeDom) {
            if(!searchMode){
                searchMode = "user";
            }
            const searchSubMenu = scopeDom.querySelector("#searchSubMenu");
            const searchInputWrap = scopeDom.querySelector("#searchInputWrap");
            const searchInput = scopeDom.querySelector("#searchInput");
            const doSearchBtn = scopeDom.querySelector("#doSearchBtn");
            const searchResultList = scopeDom.querySelector("#searchResultList");

            // 子菜单：切换搜索类型
            searchSubMenu.querySelectorAll(".search-sub-btn").forEach(btn => {
                btn.onclick = () => {
                    searchMode = btn.dataset.type;
                    searchInputWrap.style.display = "flex";
                    searchResultList.innerHTML = "";
                    searchInput.value = "";
                    if (searchMode === "user") {
                        searchInput.placeholder = "输入用户ID 或者 用户昵称";
                    } else {
                        searchInput.placeholder = "输入视频标题关键词";
                    }
                }
            })

            // 执行搜索
            async function runSearch() {
                const kw = searchInput.value.trim();
                if (!kw) {
                    alert("❌ 请输入搜索关键词");
                    return;
                }
                if(!searchMode){
                    alert("❌ 请先选择【用户搜索】或者【视频搜索】类型！");
                    return;
                }
                searchResultList.innerHTML = "<div style='color:#aaa'>搜索中...</div>";
                let url = "";
                if (searchMode === "user") {
                    url = `${api_base}/api/search/user?keyword=${encodeURIComponent(kw)}`;
                } else if (searchMode === "video") {
                    url = `${api_base}/api/search/video?keyword=${encodeURIComponent(kw)}`;
                }
                try {
                    const token = localStorage.getItem("access_token") || "";
                    const res = await fetch(url, {
                        method: "GET",
                        credentials: "include",
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    });
                    const data = await res.json();
                    if (data.code !== 1) {
                        searchResultList.innerHTML = `<div style='color:#aaa'>${data.msg}</div>`;
                        return;
                    }

                    if (searchMode === "user") {
                        // ===== 用户搜索：保持原来的用户卡片 =====
                        let html = "";
                        data.data.forEach(item => {
                            html += `
                                <div class="search-user-card">
                                    <div class="search-user-info">
                                        <div class="search-user-nick">${item.userNick}</div>
                                        <div class="search-user-id">ID: ${item.userId}</div>
                                    </div>
                                    <button class="card-btn" onclick="openOtherUserHome(${item.userId})">打开主页</button>
                                </div>
                            `
                        })
                        searchResultList.innerHTML = html;
                    } else {
                        // ===== 视频搜索：和作品页一样网格卡片渲染 =====
                        const list = data.data;
                        if (!Array.isArray(list) || list.length === 0) {
                            searchResultList.innerHTML = `<div style="color:#aaa;padding:30px;text-align:center;">没有匹配视频</div>`;
                            return;
                        }
                        searchResultList.innerHTML = `<div class="works-grid"></div>`;
                        const gridWrap = searchResultList.querySelector(".works-grid");

                        for (const item of list) {
                            // 复用你已有的 getVideoPreviewInfo，拿封面
                            const preview = await getVideoPreviewInfo(item.videoId);
                            if (!preview) continue;
                            const coverHtml = preview.coverUrl
                                ? `<img src="${preview.coverUrl}" alt="cover">`
                                : `<div class="no-cover">无封面</div>`;

                            const cardDom = document.createElement("div");
                            cardDom.className = "video-card";
                            cardDom.innerHTML = `
                                <div class="card-cover-wrap">
                                    ${coverHtml}
                                    <div class="play-btn" data-vid="${preview.videoId}"></div>
                                </div>
                                <div class="card-info">
                                    <div class="card-title">${preview.videoTitle}</div>
                                    <div class="card-meta">
                                        作者：${preview.authorNick}(ID:${preview.authorId})<br>
                                        点赞：${preview.likeCount} · ${preview.createTime}
                                    </div>
                                </div>
                            `;
                            gridWrap.appendChild(cardDom);

                            cardDom.onclick = (e) => {
                                if (e.target.classList.contains("play-btn")) return;
                                openVideo(preview.videoId);
                            };
                            const playBtn = cardDom.querySelector(".play-btn");
                            playBtn.onclick = (e) => {
                                e.stopPropagation();
                                playVideoDirect(preview.videoId);
                            };
                        }
                    }
                } catch (e) {
                    console.error(e);
                    searchResultList.innerHTML = `<div style='color:red'>搜索请求异常</div>`;
                }
            }
            doSearchBtn.onclick = runSearch;
            // 回车搜索
            searchInput.addEventListener("keypress", e => {
                if (e.key === "Enter") runSearch();
            })
        }


        // ========== 发布页面逻辑 ==========
        function openVideoUploadModal(){
            document.getElementById("videoUploadModal").style.display="flex";
            // 重置表单
            document.getElementById("videoFileInput").value = "";
            document.getElementById("videoTitleInput").value = "";
            setUploadProgress(0);
        }
        function closeVideoUploadModal(){
            document.getElementById("videoUploadModal").style.display="none";
        }
        function setUploadProgress(pct){
            document.getElementById("uploadPercent").innerText = pct;
            document.getElementById("progressBar").style.width = pct + "%";
        }

        async function submitVideoUpload(){
            const fileEl = document.getElementById("videoFileInput");
            const titleEl = document.getElementById("videoTitleInput");
            const file = fileEl.files[0];
            const title = titleEl.value.trim();

            if(!file){
                alert("请选择mp4视频文件");
                return;
            }
            if(!file.name.toLowerCase().endsWith(".mp4")){
                alert("只允许上传mp4格式视频");
                return;
            }
            if(!title){
                alert("请填写视频标题");
                return;
            }
            if(title.length > 128){
                alert("标题不能超过200个字！");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);
            formData.append("videoTitle", title);

            const xhr = new XMLHttpRequest();
            xhr.open("POST", `${api_base}/api/video/upload?loginUserId=${loginUserId}`);

            // 上传进度监听
            xhr.upload.onprogress = function(e){
                if(e.lengthComputable){
                    const percent = Math.round( (e.loaded / e.total) * 100 );
                    setUploadProgress(percent);
                }
            };

            xhr.onload = function(){
                const res = JSON.parse(xhr.responseText);
                if(res.code === 1){
                    alert("视频发布成功！");
                    closeVideoUploadModal();
                }else{
                    alert("失败：" + res.msg);
                }
            };
            xhr.onerror = function(){
                alert("网络上传错误");
            };
            xhr.send(formData);
        }

        // 打开未读消息弹窗
        async function openUnreadMessagePanel() {
            document.getElementById("msgListTitle").innerText = "未读消息";
            document.getElementById("msgListModal").style.display = "block";
            document.getElementById("msgDetailModal").style.display = "none";
            await loadMessageList("/api/message/unread-list");
        }
        // 打开历史消息弹窗
        async function openHistoryMessagePanel() {
            document.getElementById("msgListTitle").innerText = "历史消息";
            document.getElementById("msgListModal").style.display = "block";

        // 加载消息预览列表
        async function loadMessageList(apiPath) {

                    headers: { "Authorization": `Bearer ${token}` }
                })
                const json = await res.json();
                if(json.code !== 1) {
                    container.innerHTML = `<div style="color:#f87171;">${json.msg}</div>`;
                    return;
                }
                const list = json.data;
                if(list.length === 0) {
                    container.innerHTML = `<div style="color:#aaa;padding:16px;">暂无消息</div>`;
                    return;
                }
                let html = "";
                for(const item of list) {

                    html += `

                            padding:12px 16px;
                            border-radius:6px;
                            cursor:pointer;
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            border:1px solid #333;
                        ">

                                <div style="color:#fff;font-size:16px;margin-bottom:4px;">${item.title}</div>
                                <div style="color:#aaa;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;">${item.shortContent}</div>
                                <div style="color:#666;font-size:12px;margin-top:4px;">${item.createTime}</div>
                            </div>
                            <button style="border:1px solid #3b82f6;background:transparent;color:#3b82f6;padding:6px 12px;border-radius:4px;cursor:pointer;">查看</button>

                    `
                }
                container.innerHTML = html;
            } catch(err) {
                container.innerHTML = `<div style="color:#f87171;">网络加载失败</div>`;
                console.error(err);

            if(!userPageRoot) return;

        /** 打开视频详情浮窗（openVideo） */
        async function openVideo(videoId) {
            currentDetailVideoId = videoId;
            // 克隆模板
            const tpl = document.getElementById("tpl_videoDetailModal");
            detailModalDom = tpl.cloneNode(true);
            detailModalDom.style.display = "block";
            document.body.appendChild(detailModalDom);

            const player = detailModalDom.querySelector("#detailVideoPlayer");
            const titleDom = detailModalDom.querySelector("#detailVideoTitle");
            const nickDom = detailModalDom.querySelector("#detailAuthorNick");
            const aidDom = detailModalDom.querySelector("#detailAuthorId");
            const likeCountDom = detailModalDom.querySelector("#detailLikeCount");
            const timeDom = detailModalDom.querySelector("#detailCreateTime");
            const likeBtn = detailModalDom.querySelector("#videoLikeBtn");
            const gotoHomeBtn = detailModalDom.querySelector("#gotoAuthorHome");

            // 1.拉取视频详情
            const token = localStorage.getItem("access_token") || "";
            const resDetail = await fetch(`${api_base}/api/video/detail?videoId=${videoId}`);
            const dataDetail = await resDetail.json();
            if(dataDetail.code !== 1) {
                showMessage("视频加载失败", "error");
                closeVideoDetailModal();
                return;
            }
            const info = dataDetail.data;
            currentVideoAuthorUserId = info.videoAuthor;
            player.src = `${api_base}${info.videoUrl}`;
            titleDom.innerText = info.videoTitle;
            nickDom.innerText = info.userNick;
            aidDom.innerText = `ID:${info.videoAuthor}`;
            likeCountDom.innerText = info.likeCount;
            timeDom.innerText = info.createTime;

            // 进入作者主页按钮
            gotoHomeBtn.onclick = async () => {
                await openOtherUserHome(currentVideoAuthorUserId);
                closeVideoDetailModal();
            };

            const deleteVideoBtn = detailModalDom.querySelector("#deleteVideoBtn");
            // loginUserId 是全局变量，登录后存放当前登录用户ID
            if (currentVideoAuthorUserId === loginUserId) {
                deleteVideoBtn.style.display = "inline-block";
                deleteVideoBtn.onclick = async () => {
                    if (!confirm("确定要删除这个视频吗？删除后视频、评论、点赞数据都会清除，不可恢复！")) {
                        return;
                    }
                    const token = localStorage.getItem("access_token") || "";
                    const resp = await fetch(`${api_base}/api/video/delete?videoId=${videoId}`, {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    });
                    const ret = await resp.json();
                    if (ret.code === 1) {
                        showMessage("视频删除成功", "success");
                        closeVideoDetailModal();
                        // 可选：如果首页/作品列表需要刷新，可以在这里调用刷新列表函数
                        // loadVideoList();
                    } else {
                        showMessage(ret.msg || "删除失败", "error");
                    }
                }
            }

            // 2.检查点赞状态（携带token）
            let isLiked = false;
            if(token) {
                const resLike = await fetch(`${api_base}/api/video/check-like?videoId=${videoId}`, {
                    headers: {"Authorization": `Bearer ${token}`}
                });
                const likeData = await resLike.json();
                if(likeData.code === 1) {
                    isLiked = likeData.data.liked;
                }
            }
            refreshLikeBtn(likeBtn, isLiked, info.likeCount);

            // 点赞按钮点击事件
            likeBtn.onclick = async () => {
                if(!token) {
                    showMessage("请先登录！", "error");
                    return;
                }
                const action = isLiked ? "cancel-like" : "like";
                const resp = await fetch(`${api_base}/api/video/${action}?videoId=${videoId}`, {
                    method:"POST",
                    headers: {"Authorization": `Bearer ${token}`}
                });
                const ret = await resp.json();
                if(ret.code === 1) {
                    isLiked = !isLiked;
                    // 重新拉取最新点赞数
                    const newDetailRes = await fetch(`${api_base}/api/video/detail?videoId=${videoId}`);
                    const nd = await newDetailRes.json();
                    likeCountDom.innerText = nd.data.likeCount;
                    refreshLikeBtn(likeBtn, isLiked, nd.data.likeCount);
                }
            }
        }

        // 加载一级评论
        async function loadFirstLevelComments() {
            const token = localStorage.getItem("access_token") || "";
            try {
                const res = await fetch(`${api_base}/api/comment/first-list?videoId=${currentCommentVideoId}`, {
                    headers: {"Authorization": `Bearer ${token}`}
                })

        // 构建一级评论卡片
        function buildFirstCommentCard(c) {
            const likeTxt = c.isLiked ? "取消点赞" : "点赞";
            return `
            <div class="first-comment-card" data-cid="${c.commentId}" style="background:#222;padding:14px 18px;border-radius:7px;border:1px solid #333;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                    <div style="flex:1;">

                        <div style="color:#777;font-size:13px;">${c.createTime} &nbsp; 点赞：${c.likeCount}</div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button onclick="toggleCommentLike(${c.commentId},this)" data-liked="${c.isLiked}" style="border:1px solid #3b82f6;background:transparent;color:#3b82f6;padding:5px 9px;border-radius:4px;cursor:pointer;font-size:13px;">${likeTxt}</button>
                        <button onclick="setReplyTarget(${c.commentId})" style="border:1px solid #3b82f6;background:transparent;color:#3b82f6;padding:5px 9px;border-radius:4px;cursor:pointer;font-size:13px;">回复</button>
                        <button onclick="openOtherUserHome(${c.userId})" style="border:1px solid #3b82f6;background:transparent;color:#3b82f6;padding:5px 9px;border-radius:4px;cursor:pointer;font-size:13px;">进入主页</button>
                        <button onclick="loadSubComments(${c.commentId},this)" style="border:1px solid #3b82f6;background:transparent;color:#3b82f6;padding:5px 9px;border-radius:4px;cursor:pointer;font-size:13px;">展开</button>
                    </div>
                </div>
                <div class="sub-comment-container" data-parentcid="${c.commentId}" style="margin-top:12px;padding-left:22px;display:flex;flex-direction:column;gap:10px;"></div>
            </div>
            `
        }

        // 加载二级子评论（点击展开）
        async function loadSubComments(parentCid, btnDom) {
            const subBox = document.querySelector(`.sub-comment-container[data-parentcid="${parentCid}"]`);
            if(subBox.dataset.loaded === "1") {
                // 已经加载过，切换显隐
                subBox.style.display = subBox.style.display === "none" ? "flex" : "none";
                btnDom.innerText = subBox.style.display === "none" ? "展开" : "收起";
                return;
            }
            subBox.innerHTML = `<div style="color:#aaa;font-size:14px;">加载子评论...</div>`;
            const token = localStorage.getItem("access_token") || "";
            try {
                const res = await fetch(`${api_base}/api/comment/flat-descendant-list?parentFirstCommentId=${parentCid}`, {
                    headers: {"Authorization": `Bearer ${token}`}
                })
                const json = await res.json();
                if(json.code !== 1) {
                    subBox.innerHTML = `<div style="color:#f87171;">加载子评论失败</div>`;
                    return;
                }
                const subList = json.data;
                subBox.dataset.loaded = "1";
                if(subList.length === 0) {
                    subBox.innerHTML = `<div style="color:#aaa;font-size:14px;">暂无回复</div>`;
                    btnDom.innerText = "收起";
                    return;
                }
                let subHtml = "";
                for(const sc of subList) {
                    subHtml += buildSecondCommentCard(sc);
                }
                subBox.innerHTML = subHtml;
                btnDom.innerText = "收起";
            }catch(e) {
                subBox.innerHTML = `<div style="color:#f87171;">子评论加载异常</div>`;
                console.error(e);
            }
        }

                        <button onclick="setReplyTarget(${sc.commentId})" style="border:1px solid #3b82f6;background:transparent;color:#3b82f6;padding:4px 7px;border-radius:4px;cursor:pointer;font-size:12px;">回复</button>

        // 切换评论点赞
        async function toggleCommentLike(commentId, btnDom) {

            try {
                const res = await fetch(`${api_base}/api/comment/toggle-like?commentId=${commentId}`, {
                    method:"POST",

                })

        function updateCommentCount() {

        // 发表评论
        async function submitComment() {
            const content = document.getElementById("commentInput").value.trim();
            if(!content) {
                alert("评论不能为空");
                return;
            }
            // 新增字数校验
            if(content.length > 256) {
                alert("评论不能超过256个汉字！");
                return;
            }
            const token = localStorage.getItem("access_token") || "";
            let url = `${api_base}/api/comment/publish?videoId=${currentCommentVideoId}&content=${encodeURIComponent(content)}`;
            if(replyTargetParentId !== null) {
                url += `&parentId=${replyTargetParentId}`;
            }
            try {
                const res = await fetch(url, {
                    method:"POST",
                    headers: {"Authorization": `Bearer ${token}`}
                })
                const json = await res.json();
                if(json.code !== 1) {
                    alert(json.msg);
                    return;
                }
                // 发表成功，清空输入框，重置回复状态，重载一级评论
                document.getElementById("commentInput").value = "";
                updateCommentCount(); // 清空后重置计数
                replyTargetParentId = null;
                document.getElementById("replyTip").innerText = "发表新评论";
                loadFirstLevelComments();
            }catch(e) {
                alert("发表评论失败");
            }
        }

        /**
         * 获取关注列表
         * GET {api_base}/api/user/follow-list
         * 后端业务：user_service，返回按关注时间逆序
         * 返回数据格式示例：{code:1, data:{total:2, list:[{followedId:1001, userNick:"张三", createTime:"2026-10-31 22:00:00"}]}}
         */
        async function loadFollowList(container) {
            container.innerHTML = `<div class="loading-tip">加载关注列表中...</div>`;
            try {
                const token = localStorage.getItem("access_token") || "";
                const res = await fetch(`${api_base}/api/user/follow-list`, {
                    credentials: "include",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });
                const json = await res.json();
                if (json.code !== 1) {
                    container.innerHTML = `<div class="error-tip">获取关注列表失败：${json.msg}</div>`;
                    return;
                }
                const { total, list } = json.data;
                if (list.length === 0) {
                    container.innerHTML = `
                            <div class="list-title-bar">关注总数：${total}</div>
                            <div class="empty-tip">暂无关注用户</div>
                        `;
                    return;
                }
                let html = `<div class="list-title-bar">关注总数：${total}</div>`;
                list.forEach(item => {
                    html += `
                            <div class="user-item-card">
                                <div class="user-item-info">
                                    <div class="card-nick">${item.userNick}</div>
                                    <div class="card-uid">ID: ${item.followedId}</div>
                                </div>
                                <button class="card-btn" onclick="openOtherUserHome(${item.followedId})">打开主页</button>
                            </div>
                            `;
                })
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="error-tip">网络异常，关注列表加载失败</div>`
                console.error(e);
            }
        }

        /**
         * 获取粉丝列表

        /** 用户点赞视频 GET {api_base}/api/user/like-video */
        async function loadLikeVideo(container) {
            container.innerHTML = `<div style="color:#aaa;padding:20px;">加载点赞视频列表...</div>`;
            try {
                const token = localStorage.getItem("access_token") || "";
                const res = await fetch(`${api_base}/api/user/like-video?loginUserId=${loginUserId}`, {
                    credentials: "include",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });
                const json = await res.json();
                if (json.code !== 1) {
                    container.innerHTML = `<div style="color:#ff7777">加载失败：${json.msg}</div>`;
                    return;
                }
                const videoIdList = json.data;
                if (!Array.isArray(videoIdList) || videoIdList.length === 0) {
                    container.innerHTML = `<div style="color:#aaa;padding:30px;text-align:center;">暂无点赞视频</div>`;
                    return;
                }
                container.innerHTML = `<div class="works-grid"></div>`;
                const gridWrap = container.querySelector(".works-grid");

                // 循环每个videoId，拉取预览信息（和作品完全一致，复用getVideoPreviewInfo）
                for (const vid of videoIdList) {
                    const preview = await getVideoPreviewInfo(vid);
                    if (!preview) continue;
                    const coverHtml = preview.coverUrl
                        ? `<img src="${preview.coverUrl}" alt="cover">`
                        : `<div class="no-cover">无封面</div>`;

                    const cardDom = document.createElement("div");
                    cardDom.className = "video-card";
                    cardDom.innerHTML = `
                            <div class="card-cover-wrap">
                                ${coverHtml}
                                <div class="play-btn" data-vid="${preview.videoId}"></div>
                            </div>
                            <div class="card-info">
                                <div class="card-title">${preview.videoTitle}</div>
                                <div class="card-meta">
                                    作者：${preview.authorNick}(ID:${preview.authorId})<br>
                                    点赞：${preview.likeCount} · ${preview.createTime}
                                </div>
                            </div>
                        `;
                    gridWrap.appendChild(cardDom);

                    cardDom.onclick = (e) => {
                        // 如果点击的是播放按钮，交给播放按钮单独处理，不触发卡片默认事件
                        if (e.target.classList.contains("play-btn")) return;
                        openVideo(preview.videoId);
                    };
                    // 播放按钮单独事件
                    const playBtn = cardDom.querySelector(".play-btn");
                    playBtn.onclick = (e) => {
                        e.stopPropagation();
                        playVideoDirect(preview.videoId);
                    };
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div style="color:red;">网络异常，点赞视频加载失败</div>`;
            }
        }

        // 刷新 关注、拉黑、作品按钮 的显示文字/显示隐藏（核心联动）
        function refreshOtherUserButtonState(){
            const followBtn = document.getElementById("otherFollowBtn");
            const blockBtn = document.getElementById("otherBlockBtn");
            const worksBtn = document.getElementById("otherWorksBtn");

            if(loginUserIsBlocked){
                followBtn.innerText = "none";
                blockBtn.innerText = "none";
                worksBtn.style.display = "none";
            }
            if(otherUserIsBlock){
                // 拉黑状态
                followBtn.innerText = "关注";
                blockBtn.innerText = "解除黑名单";
                worksBtn.style.display = "none"; // 拉黑隐藏作品按钮
            }else{
                // 未拉黑
                worksBtn.style.display = "inline-block";
                if(otherUserIsFollow){
                    followBtn.innerText = "取消关注";
                }else{
                    followBtn.innerText = "关注";
                }
                blockBtn.innerText = "加入黑名单";
            }
        }

        document.getElementById("otherFollowBtn").onclick = async function(){

            let url;
            if(otherUserIsFollow){
                // 取消关注
                url = `${api_base}/api/account/unfollow?loginUserId=${loginUserId}&targetUserId=${currentViewingUserId}`
                otherUserIsFollow = false;
            }else{
                // 关注：后端自动解除拉黑，所以前端isBlock也要更新为false
                url = `${api_base}/api/account/follow?loginUserId=${loginUserId}&targetUserId=${currentViewingUserId}`
                otherUserIsFollow = true;
                otherUserIsBlock = false;
            }
            const r = await fetch(url, {method:"POST"});
            const ret = await r.json();
            if(ret.code ===1){
                refreshOtherUserButtonState();
            }else{
                alert(ret.msg);
            }
        }

        }

        // 他人主页：加载别人的作品列表（和自己作品渲染逻辑完全复用卡片、getVideoPreviewInfo、openVideo、playVideoDirect）
        async function loadOtherUserWorks(container, targetUserId) {
            try {
                if (otherUserIsBlock){
                    container.innerHTML = `<div style="color:#aaa;padding:30px;text-align:center;">该用户已被你拉黑</div>`;
                    return;
                }
                else if (loginUserIsBlocked){
                    container.innerHTML = `<div style="color:#aaa;padding:30px;text-align:center;">你已被该用户拉黑</div>`;
                    return;
                }
                container.innerHTML = `<div style="color:#aaa;padding:20px;">加载用户作品列表...</div>`;
                const token = localStorage.getItem("access_token") || "";
                const res = await fetch(`${api_base}/api/account/works?userId=${targetUserId}`, {
                    credentials: "include",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });
                const json = await res.json();
                if (json.code !== 1) {
                    container.innerHTML = `<div style="color:#ff7777">加载失败：${json.msg}</div>`;
                    return;
                }
                const videoIdList = json.data;
                if (!Array.isArray(videoIdList) || videoIdList.length === 0) {
                    container.innerHTML = `<div style="color:#aaa;padding:30px;text-align:center;">该用户暂无作品</div>`;
                    return;
                }
                container.innerHTML = `<div class="works-grid"></div>`;
                const gridWrap = container.querySelector(".works-grid");

                for (const vid of videoIdList) {
                    const preview = await getVideoPreviewInfo(vid);
                    if (!preview) continue;
                    const coverHtml = preview.coverUrl
                        ? `<img src="${preview.coverUrl}" alt="cover">`
                        : `<div class="no-cover">无封面</div>`;

                    const cardDom = document.createElement("div");
                    cardDom.className = "video-card";
                    cardDom.innerHTML = `
                        <div class="card-cover-wrap">
                            ${coverHtml}
                            <div class="play-btn" data-vid="${preview.videoId}"></div>
                        </div>
                        <div class="card-info">
                            <div class="card-title">${preview.videoTitle}</div>
                            <div class="card-meta">
                                作者：${preview.authorNick}(ID:${preview.authorId})<br>
                                点赞：${preview.likeCount} · ${preview.createTime}
                            </div>
                        </div>
                    `;
                    gridWrap.appendChild(cardDom);

                    cardDom.onclick = (e) => {
                        if (e.target.classList.contains("play-btn")) return;
                        openVideo(preview.videoId);
                    };
                    const playBtn = cardDom.querySelector(".play-btn");
                    playBtn.onclick = (e) => {
                        e.stopPropagation();
                        playVideoDirect(preview.videoId);
                    };
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div style="color:red;">网络异常，作品加载失败</div>`;
            }
        }

        /**
         * 全局消息提示
         * @param {string} text 提示文字
         * @param {string} type success | info | error
         */
        function showMessage(text, type = "info") {
            // 先清除旧提示，避免堆叠
            let old = document.getElementById("globalToastMsg");
            if (old) old.remove();

            let bgColor;
            switch (type) {
                case "success":
                    bgColor = "#16a34a";
                    break;
                case "error":
                    bgColor = "#dc2626";
                    break;
                default:
                    bgColor = "#3b82f6";
            }

            const toast = document.createElement("div");
            toast.id = "globalToastMsg";
            toast.style.position = "fixed";
            toast.style.zIndex = "9999";
            toast.style.left = "50%";
            toast.style.top = "24px";
            toast.style.transform = "translateX(-50%)";
            toast.style.background = bgColor;
            toast.style.color = "#fff";
            toast.style.padding = "10px 20px";
            toast.style.borderRadius = "6px";
            toast.style.fontSize = "14px";
            toast.style.boxShadow = "0 2px 12px rgba(0,0,0,0.4)";
            toast.style.whiteSpace = "nowrap";
            toast.innerText = text;

            document.body.appendChild(toast);

            // 3秒自动消失
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

    </script>
