<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - zhy_dbscd简易短视频平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1e1e1e;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.55);
            padding: 42px;
            width: 100%;
            max-width: 460px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: translateY(-18px);}
            to {opacity:1; transform: translateY(0);}
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 32px;
            font-size: 26px;
            font-weight: 600;
        }
        .tab-buttons {
            display: flex;
            gap:10px;
            margin-bottom:30px;
        }
        .tab-btn {
            flex: 1;
            background: #2d2d2d;
            color:#bbbbbb;
            border:none;
            padding:12px;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition: all 0.25s;
        }
        .tab-btn.active {
            background: #7c3aed;
            color:#fff;
        }
        .form-group {
            margin-bottom:20px;
        }
        label {
            display:block;
            margin-bottom:8px;
            color:#cccccc;
            font-weight:500;
            font-size:14px;
        }
        input {
            width:100%;
            padding:13px 16px;
            background:#2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius:10px;
            color:#fff;
            font-size:15px;
            transition: 0.25s;
        }
        input:focus {
            outline:none;
            border-color:#7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18);
        }
        .input-group {
            display:flex;
            gap:10px;
        }
        .input-group input {
            flex:1;
        }
        button {
            background: #7c3aed;
            color:white;
            border:none;
            padding:13px 18px;
            border-radius:10px;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition: 0.25s;
        }
        button:hover:not(:disabled) {
            background:#6d28d9;
            transform: translateY(-1px);
        }
        button:disabled {
            opacity:0.55;
            cursor:not-allowed;
        }
        .btn-code {
            white-space: nowrap;
        }
        .login-btn {
            width:100%;
            padding:14px;
            font-size:16px;
            margin-top:8px;
        }
        .message {
            margin-top:16px;
            padding:12px;
            border-radius:10px;
            text-align:center;
            font-size:14px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {opacity:0; transform: translateY(-8px);}
            to {opacity:1; transform: translateY(0);}
        }
        .message.success {
            background:#163b2b;
            color:#86efac;
            border:1px solid #22543d;
        }
        .message.error {
            background:#421c1c;
            color:#fca5a5;
            border:1px solid #7f1d1d;
        }
        .separator {
            text-align:center;
            margin:24px 0 16px;
            position:relative;
        }
        .separator::before {
            content:'';
            position:absolute;
            top:50%;
            left:0;
            right:0;
            height:1px;
            background:#333;
        }
        .separator span {
            background:#1e1e1e;
            padding:0 14px;
            position:relative;
            color:#888;
            font-size:13px;
        }
        .register-link {
            text-align:center;
        }
        .register-link a {
            color:#a78bfa;
            text-decoration:none;
            font-weight:600;
        }
        .register-link a:hover {
            color:#c4b5fd;
            text-decoration: underline;
        }
        .hint {
            font-size:12px;
            color:#888;
            margin-top:5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 zhy_dbscd简易短视频平台</h2>
        <div class="tab-buttons">
            <button id="btn-pwd" class="tab-btn active">密码登录</button>
            <button id="btn-code" class="tab-btn">验证码登录</button>
        </div>
        <div id="pwd-box">
            <div class="form-group">
                <label>📧 / 🆔 邮箱或用户ID</label>
                <input id="account" type="text" placeholder="输入注册邮箱或者用户ID">
                <div class="hint">💡 支持 userId 数字 或者注册邮箱</div>
            </div>
            <div class="form-group">
                <label>🔒 密码</label>
                <input id="password" type="password" placeholder="输入登录密码">
            </div>
        </div>
        <div id="code-box" style="display:none;">
            <div class="form-group">
                <label>📧 / 🆔 邮箱或用户ID</label>
                <div class="input-group">
                    <input id="code-account" type="text" placeholder="输入注册邮箱或者用户ID">
                    <button id="sendCodeBtn" class="btn-code">发送验证码</button>
                </div>
                <div class="hint">💡 支持 userId 数字 或者注册邮箱</div>
            </div>
            <div class="form-group">
                <label>📩 验证码</label>
                <input id="login-code" type="text" maxlength="6" placeholder="6位数字验证码">
            </div>
        </div>
        <button id="loginBtn" class="login-btn">登录</button>
        <div id="message"></div>
        <div class="separator">
            <span>还没有账号？</span>
        </div>
        <div class="register-link">
            <a href="/user/register">前往注册 →</a>
        </div>
    </div>
    <script>
        const API_BASE = '';
        let loginType = "password";
        let codeCountdown = 0;
        let codeTimer = null;

        const btnPwd = document.getElementById('btn-pwd');
        const btnCode = document.getElementById('btn-code');
        const pwdBox = document.getElementById('pwd-box');
        const codeBox = document.getElementById('code-box');
        const accountInput = document.getElementById('account');
        const codeAccountInput = document.getElementById('code-account');
        const passwordInput = document.getElementById('password');
        const loginCodeInput = document.getElementById('login-code');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const loginBtn = document.getElementById('loginBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            setTimeout(()=>{
                if(messageDiv.className === `message ${type}`){
                    messageDiv.style.opacity = '0';
                    setTimeout(()=>{
                        messageDiv.className = '';
                        messageDiv.textContent = '';
                        messageDiv.style.opacity = '1';
                    },300)
                }
            },3000)
        }
        function switchLoginType(type){
            loginType = type;
            if(type === "password"){
                pwdBox.style.display="block";
                codeBox.style.display="none";
                btnPwd.classList.add("active");
                btnCode.classList.remove("active");
            }else{
                pwdBox.style.display="none";
                codeBox.style.display="block";
                btnPwd.classList.remove("active");
                btnCode.classList.add("active");
            }
        }
        function updateSendButton(){
            if(codeCountdown>0){
                sendCodeBtn.disabled=true;
                sendCodeBtn.textContent = `${codeCountdown}秒后重试`;
            }else{
                sendCodeBtn.disabled=false;
                sendCodeBtn.textContent="发送验证码";
            }
        }
        function startCodeCountdown(){
            if(codeTimer) clearInterval(codeTimer);
            codeCountdown=60;
            updateSendButton();
            codeTimer = setInterval(()=>{
                codeCountdown--;
                updateSendButton();
                if(codeCountdown<=0){
                    clearInterval(codeTimer);
                    codeTimer=null;
                    updateSendButton();
                }
            },1000)
        }
        async function sendLoginCode(){
            const account = codeAccountInput.value.trim();
            if(!account){
                showMessage("❌ 请输入邮箱/用户ID",'error');
                return;
            }
            sendCodeBtn.disabled=true;
            sendCodeBtn.textContent="发送中...";
            try{
                const res = await fetch(`${API_BASE}/api/user/login-send-code`,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({account})
                })
                const data = await res.json();
                showMessage(data.msg, data.code===1?'success':'error');
                if(data.code===1){
                    startCodeCountdown();
                }else{
                    sendCodeBtn.disabled=false;
                    sendCodeBtn.textContent="发送验证码";
                }
            }catch(e){
                console.error(e);
                showMessage("❌ 请求异常",'error');
                sendCodeBtn.disabled=false;
                sendCodeBtn.textContent="发送验证码";
            }
        }
        async function login(){
            let account;
            if(loginType==="password"){
                account = accountInput.value.trim();
            }else{
                account = codeAccountInput.value.trim();
            }
            if(!account){
                showMessage("❌ 请输入账号",'error');
                return;
            }
            let payload = {account, loginType};
            if(loginType==="password"){
                const pwd = passwordInput.value;
                if(!pwd){
                    showMessage("❌ 请输入密码",'error');
                    return;
                }
                payload.password = pwd;
            }else{
                const code = loginCodeInput.value.trim();
                if(!code){
                    showMessage("❌ 请输入验证码",'error');
                    return;
                }
                payload.code = code;
            }
            loginBtn.disabled=true;
            loginBtn.textContent="登录中...";
            try{
                const res = await fetch(`${API_BASE}/api/user/login`,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify(payload)
                })
                const data = await res.json();
                showMessage(data.msg, data.code===1?'success':'error');
                if(data.code===1){
                    localStorage.setItem('access_token', data.data.access_token);
                    localStorage.setItem('refresh_token', data.data.refresh_token);
                    localStorage.setItem('userId', data.data.userId);
                    setTimeout(()=>{
                        location.href="/home";
                    },1000)
                }else{
                    loginBtn.disabled=false;
                    loginBtn.textContent="登录";
                }
            }catch(e){
                console.error(e);
                showMessage("❌ 登录请求异常",'error');
                loginBtn.disabled=false;
                loginBtn.textContent="登录";
            }
        }
        btnPwd.onclick = ()=>switchLoginType("password");
        btnCode.onclick = ()=>switchLoginType("code");
        sendCodeBtn.onclick = sendLoginCode;
        loginBtn.onclick = login;
        //回车快捷登录
        accountInput.addEventListener('keypress',e=>{if(e.key==='Enter'&&loginType==='password') login()})
        passwordInput.addEventListener('keypress',e=>{if(e.key==='Enter') login()})
        codeAccountInput.addEventListener('keypress',e=>{if(e.key==='Enter') sendLoginCode()})
        loginCodeInput.addEventListener('keypress',e=>{if(e.key==='Enter') login()})
    </script>
</body>
</html>
